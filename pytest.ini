[pytest]
# Pytest configuration for llm-cpp-toolkit

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes

# Markers for test categorization
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (moderate speed, may use external tools)
    e2e: End-to-end tests (slow, full workflow)
    slow: Tests that take more than 1 second
    requires_tools: Tests that require external tools (clang-tidy, cppcheck, etc.)

# Coverage options (if pytest-cov is installed)
# Uncomment to enable coverage reporting
# addopts = --cov=llmtk --cov=modules --cov-report=html --cov-report=term-missing

# Timeout (if pytest-timeout is installed)
# timeout = 30

# Minimum Python version
minversion = 3.8

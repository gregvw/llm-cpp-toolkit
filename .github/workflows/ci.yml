name: CI

on:
  push:
  pull_request:

jobs:
  toolkit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install pyyaml jinja2

      - name: Configure git author
        run: |
          git config --global user.email "ci@llmtk.dev"
          git config --global user.name "llmtk CI"

      - name: Verify llmtk --help lists expected commands
        run: |
          set -euo pipefail
          HELP_OUTPUT="$(python cli/llmtk --help)"
          echo "$HELP_OUTPUT"
          for cmd in doctor init capabilities telemetry analyze stderr-thin; do
            echo "$HELP_OUTPUT" | grep -F " $cmd" >/dev/null || {
              echo "Expected command '$cmd' missing from help output" >&2
              exit 1
            }
          done
        shell: bash

      - name: Run llmtk doctor
        run: python cli/llmtk doctor
        shell: bash

      - name: Initialize new project with llmtk init
        run: python cli/llmtk init test_proj
        shell: bash

      - name: Upgrade project with llmtk init --existing
        run: python cli/llmtk init --existing --path test_proj
        shell: bash

      - name: Build generated project with CMake and Make
        run: |
          set -euo pipefail
          cmake -S test_proj -B test_proj/build
          cmake --build test_proj/build
          ./test_proj/build/test_proj
        shell: bash

  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history so the diff-check step can compare against the PR base.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install CMake, Ninja, and a C++ compiler
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++
        shell: bash

      - name: Sync locked environment
        run: uv sync --locked

      - name: Run unit and integration tests
        run: uv run --locked python -m unittest discover -v
        shell: bash

      - name: Build sdist and wheel
        run: uv build --no-sources
        shell: bash

      - name: Check diff for whitespace and conflict markers
        if: github.event_name == 'pull_request'
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"
        shell: bash

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-cpp-toolkit"
description = "C++/CMake build intelligence backend for AI coding agents"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dynamic = ["version"]
keywords = ["llm", "cpp", "tooling", "cli"]
authors = [
  { name = "LLM C++ Toolkit Maintainers" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: POSIX :: Linux",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Build Tools"
]
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.uv]
package = true

[project.scripts]
llmtk = "llmtk_bootstrap.bootstrap:main"
llmtk-bootstrap = "llmtk_bootstrap.bootstrap:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["llmtk_bootstrap", "llmtk_bootstrap.data"]
include-package-data = true

[tool.setuptools.dynamic.version]
file = "VERSION"

[tool.setuptools.package-data]
"llmtk_bootstrap.data" = ["*.json"]
